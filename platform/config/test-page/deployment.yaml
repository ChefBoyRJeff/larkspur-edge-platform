# Platform test page: proves restricted pod security, internal CA TLS and Traefik routing end to end.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-page
  namespace: larkspur-dev
  labels:
    app.kubernetes.io/name: test-page
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: test-page
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-page
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: test-page
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          args: ["--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
