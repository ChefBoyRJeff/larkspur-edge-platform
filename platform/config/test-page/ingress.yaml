# HTTPS only (Traefik websecure entrypoint).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-page
  namespace: larkspur-dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - test.larkspur.home.arpa
      secretName: test-page-tls
  rules:
    - host: test.larkspur.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: test-page
                port:
                  name: http
