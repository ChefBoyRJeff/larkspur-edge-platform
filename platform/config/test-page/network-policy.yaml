# The only allowed way in: Traefik pods in kube-system, on the app port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-test-page
  namespace: larkspur-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: test-page
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
