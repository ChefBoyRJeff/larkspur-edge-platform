# App namespaces. Pod Security Admission enforces the "restricted" profile.
apiVersion: v1
kind: Namespace
metadata:
  name: larkspur-dev
  labels:
    environment: dev
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# App namespaces. Pod Security Admission enforces the "restricted" profile.
apiVersion: v1
kind: Namespace
metadata:
  name: larkspur-prod
  labels:
    environment: prod
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Monitoring. node-exporter reads host metrics (host network, PID namespace and filesystem),
# which the baseline and restricted profiles forbid, so this namespace is privileged.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
