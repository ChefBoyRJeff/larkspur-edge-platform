# TLS certificate for Grafana from the Larkspur internal CA; cert-manager renews it automatically.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: monitoring
spec:
  secretName: grafana-tls
  dnsNames:
    - grafana.larkspur.home.arpa
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: larkspur-ca
    kind: ClusterIssuer
    group: cert-manager.io
