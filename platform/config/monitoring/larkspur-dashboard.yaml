# Grafana dashboard "Larkspur Track". The Grafana sidecar loads every ConfigMap labelled
# grafana_dashboard: "1". Edit the JSON here, not in Grafana: Grafana's data is not kept.
apiVersion: v1
kind: ConfigMap
metadata:
  name: larkspur-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  larkspur-track.json: |
    {
      "uid": "larkspur-track",
      "title": "Larkspur Track",
      "tags": [
        "larkspur"
      ],
      "timezone": "browser",
      "editable": true,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "type": "row",
          "title": "Prod SLOs (rolling 7 days)",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Availability (target 99.5%)",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Share of real requests (health checks excluded) that did not return a 5xx error.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "1 - larkspur:slo_errors:ratio_rate7d{namespace=\"larkspur-prod\"}",
              "legendFormat": "__auto",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "noValue": "no traffic yet",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.995
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Availability budget left",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "How much of the 0.5% weekly error allowance is still unused. Below 0% means the SLO is missed.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "1 - larkspur:slo_errors:ratio_rate7d{namespace=\"larkspur-prod\"} / 0.005",
              "legendFormat": "__auto",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 0,
              "noValue": "no traffic yet",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 0.25
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Answered within 1 s (target 99%)",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Share of real requests answered within 1 second.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "1 - larkspur:slo_slow:ratio_rate7d{namespace=\"larkspur-prod\"}",
              "legendFormat": "__auto",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "noValue": "no traffic yet",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Latency budget left",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "How much of the 1% weekly slow-request allowance is still unused.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "1 - larkspur:slo_slow:ratio_rate7d{namespace=\"larkspur-prod\"} / 0.01",
              "legendFormat": "__auto",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 0,
              "noValue": "no traffic yet",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 0.25
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Traffic: dev and prod",
          "id": 6,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Requests per second",
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Real requests; health checks excluded.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (namespace) (rate(larkspur_http_requests_total{route!~\"/healthz|/readyz\"}[5m]))",
              "legendFormat": "{{namespace}}",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": true
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Server errors (share of requests)",
          "id": 8,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "larkspur:slo_errors:ratio_rate5m",
              "legendFormat": "{{namespace}}",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": true
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Response time (95th percentile)",
          "id": 9,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "95% of requests were faster than this.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 15
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (namespace, le) (rate(larkspur_http_request_duration_seconds_bucket{route!~\"/healthz|/readyz\"}[5m])))",
              "legendFormat": "{{namespace}}",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": true
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Slower than 1 second (share of requests)",
          "id": 10,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 15
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "larkspur:slo_slow:ratio_rate5m",
              "legendFormat": "{{namespace}}",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": true
              }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Shipments and sign-ins",
          "id": 11,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 23
          },
          "panels": []
        },
        {
          "type": "bargauge",
          "title": "Shipments by status",
          "id": 12,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max by (namespace, status) (larkspur_shipments)",
              "legendFormat": "{{namespace}} {{status}}",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "options": {
            "orientation": "horizontal",
            "displayMode": "basic",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "Counted from each environment's database; max() because every web pod reports the same count."
        },
        {
          "type": "timeseries",
          "title": "Sign-ins per hour",
          "id": 13,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Five failures in a row lock an account for 15 minutes.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (namespace, result) (increase(larkspur_sign_ins_total[1h]))",
              "legendFormat": "{{namespace}} {{result}}",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": true
              }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Health from the user's side",
          "id": 14,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 32
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Page checks",
          "id": 15,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "The blackbox exporter loads each page over trusted HTTPS every 30 seconds.",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 33
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
