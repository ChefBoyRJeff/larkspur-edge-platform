# Monitoring for the dev database. The PodMonitor and PrometheusRule CRDs come from
# kube-prometheus-stack; platform-config retries the sync until they exist.
---
# CloudNativePG publishes PostgreSQL metrics on each instance's "metrics" port (9187).
# Created here rather than by the operator: the Cluster's enablePodMonitor is deprecated.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: larkspur-db
  namespace: larkspur-dev
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: larkspur-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
# Alerts for the dev database. What to do for each: docs/runbooks/alerts.md.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: larkspur-db
  namespace: larkspur-dev
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: larkspur-db
      rules:
        - alert: LarkspurDatabaseDown
          # No instance reports PostgreSQL up (pod gone, PostgreSQL stopped, or metrics unreachable).
          expr: absent(cnpg_collector_up{namespace="larkspur-dev"} == 1)
          for: 2m
          labels:
            severity: critical
            namespace: larkspur-dev
          annotations:
            summary: The larkspur-dev database is down
            description: PostgreSQL has not reported up for 2 minutes.
            runbook: docs/runbooks/alerts.md#larkspurdatabasedown
        - alert: LarkspurDatabaseNearConnectionLimit
          expr: |
            sum(cnpg_backends_total{namespace="larkspur-dev"})
              / max(cnpg_pg_settings_setting{namespace="larkspur-dev", name="max_connections"}) > 0.8
          for: 5m
          labels:
            severity: warning
            namespace: larkspur-dev
          annotations:
            summary: The larkspur-dev database is near its connection limit
            description: Over 80% of max_connections have been in use for 5 minutes.
            runbook: docs/runbooks/alerts.md#larkspurdatabasenearconnectionlimit
        - alert: LarkspurDatabaseLarge
          # 75% of the 2 GiB planned for the volume. local-path does not enforce the size, so
          # the database could keep growing until the node's disk is full.
          expr: max(cnpg_pg_database_size_bytes{namespace="larkspur-dev", datname="larkspur"}) > 1610612736
          for: 15m
          labels:
            severity: warning
            namespace: larkspur-dev
          annotations:
            summary: The larkspur-dev database is larger than planned
            description: The larkspur database is over 1.5 GiB (75% of the 2 GiB planned).
            runbook: docs/runbooks/alerts.md#larkspurdatabaselarge
        - alert: LarkspurDatabaseMetricsFailing
          expr: max(cnpg_collector_last_collection_error{namespace="larkspur-dev"}) == 1
          for: 10m
          labels:
            severity: warning
            namespace: larkspur-dev
          annotations:
            summary: Metric collection for the larkspur-dev database is failing
            description: CloudNativePG could not query PostgreSQL for metrics for 10 minutes.
            runbook: docs/runbooks/alerts.md#larkspurdatabasemetricsfailing
        - alert: LarkspurWalArchivingFailing
          # A WAL file failed to reach Azure in the last 10 minutes and none has succeeded since:
          # changes since then would be lost with the node (RPO target: 5 minutes).
          expr: |
            max(cnpg_pg_stat_archiver_seconds_since_last_failure{namespace="larkspur-dev"}) < 600
              unless max(cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="larkspur-dev"})
                < max(cnpg_pg_stat_archiver_seconds_since_last_failure{namespace="larkspur-dev"})
          for: 10m
          labels:
            severity: critical
            namespace: larkspur-dev
          annotations:
            summary: The larkspur-dev database cannot archive WAL to Azure
            description: WAL archiving to Azure Blob Storage has been failing for 10 minutes.
            runbook: docs/runbooks/alerts.md#larkspurwalarchivingfailing
        - alert: LarkspurBackupTooOld
          # Nightly base backups: more than 26 hours means last night's failed (or none exists).
          expr: |
            time() - max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="larkspur-dev"}) > 93600
              or absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="larkspur-dev"})
          for: 30m
          labels:
            severity: warning
            namespace: larkspur-dev
          annotations:
            summary: The larkspur-dev database has no recent base backup
            description: The newest base backup in Azure is more than 26 hours old, or there is none.
            runbook: docs/runbooks/alerts.md#larkspurbackuptooold
