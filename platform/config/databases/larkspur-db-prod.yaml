# Prod database: one PostgreSQL 18 instance managed by CloudNativePG, configured like dev.
# Backed up to Azure Blob Storage (larkspur-db-prod-backup.yaml, ADR-0008).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: larkspur-db
  namespace: larkspur-prod
  annotations:
    # The CRD comes from the cloudnative-pg app. On a fresh cluster it may not exist yet;
    # platform-config retries the sync until it does.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1
  # Pinned to the operator 1.30.2 default so operator upgrades never change PostgreSQL silently.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie
  # With one instance, a PodDisruptionBudget would block node drains (patch-nodes runbook).
  enablePDB: false
  bootstrap:
    initdb:
      database: larkspur
      owner: larkspur
  # WAL archiving and base backups to Azure Blob Storage (larkspur-db-prod-backup.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: larkspur-db-backup
  storage:
    storageClass: local-path
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
