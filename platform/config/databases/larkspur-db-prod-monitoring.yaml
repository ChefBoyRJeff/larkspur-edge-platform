# Monitoring for the prod database. The PodMonitor and PrometheusRule CRDs come from
# kube-prometheus-stack; platform-config retries the sync until they exist.
---
# CloudNativePG publishes PostgreSQL metrics on each instance's "metrics" port (9187).
# Created here rather than by the operator: the Cluster's enablePodMonitor is deprecated.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: larkspur-db
  namespace: larkspur-prod
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: larkspur-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
# Alerts for the prod database. What to do for each: docs/runbooks/alerts.md.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: larkspur-db
  namespace: larkspur-prod
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: larkspur-db
      rules:
        - alert: LarkspurDatabaseDown
          # No instance reports itself as the primary (not in recovery): the database cannot take
          # writes. A live replica alone does not count (node-loss drill, 11-27-2026: the replica
          # kept reporting up while the primary's node was off, so the old rule never fired).
          expr: absent(cnpg_pg_replication_in_recovery{namespace="larkspur-prod"} == 0)
          for: 2m
          labels:
            severity: critical
            namespace: larkspur-prod
          annotations:
            summary: The larkspur-prod database is down
            description: No PostgreSQL instance has reported as the primary for 2 minutes.
            runbook: docs/runbooks/alerts.md#larkspurdatabasedown
        - alert: LarkspurDatabaseReplicaMissing
          # Fewer than two instances report PostgreSQL up: the database still works, but it no
          # longer survives losing its node.
          expr: count(cnpg_collector_up{namespace="larkspur-prod"} == 1) < 2
          for: 10m
          labels:
            severity: warning
            namespace: larkspur-prod
          annotations:
            summary: The larkspur-prod database is running without a replica
            description: Fewer than two PostgreSQL instances have reported up for 10 minutes.
            runbook: docs/runbooks/alerts.md#larkspurdatabasereplicamissing
        - alert: LarkspurDatabaseNearConnectionLimit
          expr: |
            sum(cnpg_backends_total{namespace="larkspur-prod"})
              / max(cnpg_pg_settings_setting{namespace="larkspur-prod", name="max_connections"}) > 0.8
          for: 5m
          labels:
            severity: warning
            namespace: larkspur-prod
          annotations:
            summary: The larkspur-prod database is near its connection limit
            description: Over 80% of max_connections have been in use for 5 minutes.
            runbook: docs/runbooks/alerts.md#larkspurdatabasenearconnectionlimit
        - alert: LarkspurDatabaseLarge
          # 75% of the 2 GiB planned for the volume. local-path does not enforce the size, so
          # the database could keep growing until the node's disk is full.
          expr: max(cnpg_pg_database_size_bytes{namespace="larkspur-prod", datname="larkspur"}) > 1610612736
          for: 15m
          labels:
            severity: warning
            namespace: larkspur-prod
          annotations:
            summary: The larkspur-prod database is larger than planned
            description: The larkspur database is over 1.5 GiB (75% of the 2 GiB planned).
            runbook: docs/runbooks/alerts.md#larkspurdatabaselarge
        - alert: LarkspurDatabaseMetricsFailing
          expr: max(cnpg_collector_last_collection_error{namespace="larkspur-prod"}) == 1
          for: 10m
          labels:
            severity: warning
            namespace: larkspur-prod
          annotations:
            summary: Metric collection for the larkspur-prod database is failing
            description: CloudNativePG could not query PostgreSQL for metrics for 10 minutes.
            runbook: docs/runbooks/alerts.md#larkspurdatabasemetricsfailing
        - alert: LarkspurWalArchivingFailing
          # A WAL file failed to reach Azure in the last 10 minutes and none has succeeded since:
          # changes since then would be lost with the node (RPO target: 5 minutes).
          # seconds_since_last_failure is -1 when an instance has never failed; ignore that, or a
          # fresh primary alerts until its first failure (dev fired 04:31-09:23 PM on 11-27-2026).
          expr: |
            max(cnpg_pg_stat_archiver_seconds_since_last_failure{namespace="larkspur-prod"} >= 0) < 600
              unless max(cnpg_pg_stat_archiver_seconds_since_last_archival{namespace="larkspur-prod"})
                < max(cnpg_pg_stat_archiver_seconds_since_last_failure{namespace="larkspur-prod"})
          for: 10m
          labels:
            severity: critical
            namespace: larkspur-prod
          annotations:
            summary: The larkspur-prod database cannot archive WAL to Azure
            description: WAL archiving to Azure Blob Storage has been failing for 10 minutes.
            runbook: docs/runbooks/alerts.md#larkspurwalarchivingfailing
        - alert: LarkspurBackupTooOld
          # Nightly base backups: more than 26 hours means last night's failed (or none exists).
          expr: |
            time() - max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="larkspur-prod"}) > 93600
              or absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="larkspur-prod"})
          for: 30m
          labels:
            severity: warning
            namespace: larkspur-prod
          annotations:
            summary: The larkspur-prod database has no recent base backup
            description: The newest base backup in Azure is more than 26 hours old, or there is none.
            runbook: docs/runbooks/alerts.md#larkspurbackuptooold
