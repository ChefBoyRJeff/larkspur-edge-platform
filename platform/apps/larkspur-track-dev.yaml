# Larkspur Track in larkspur-dev, rendered from the Helm chart in this repository.
# The namespace, guardrails and database come from platform-config.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: larkspur-track-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ChefBoyRJeff/larkspur-edge-platform.git
    targetRevision: main
    path: charts/larkspur-track
    helm:
      releaseName: larkspur-track
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: larkspur-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      # Retry with the latest commit, so a revert merged during a failing sync is picked up
      # by the next attempt (bad-release drill, 11-27-2026).
      refresh: true
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
