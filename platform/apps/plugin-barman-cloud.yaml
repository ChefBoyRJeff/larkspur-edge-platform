# CloudNativePG's Barman Cloud plugin: ships each database's WAL and base backups to Azure Blob
# Storage (see ADR-0008). Must run in the operator's namespace. The plugin and the operator talk
# over mutual TLS with certificates the chart issues through cert-manager.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plugin-barman-cloud
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: plugin-barman-cloud
    targetRevision: 0.9.0
    helm:
      valuesObject:
        # Two replicas on different nodes. The operator cannot reconcile a cluster, including a
        # failover, while this plugin is unreachable (node-loss drill, 11-27-2026: failover waited
        # until the plugin was rescheduled, about 7.5 minutes). Since v0.16.0 every replica serves
        # the gRPC API; only the ObjectStore controller needs the leader lease.
        replicaCount: 2
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: plugin-barman-cloud
                    app.kubernetes.io/instance: plugin-barman-cloud
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The CRDs are large, and the cert-manager CRDs it uses come from another app.
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
