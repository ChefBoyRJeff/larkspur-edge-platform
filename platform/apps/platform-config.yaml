# Cluster-wide platform configuration (issuers, namespaces, policies) from platform/config.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ChefBoyRJeff/larkspur-edge-platform.git
    targetRevision: main
    path: platform/config
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Resources whose CRDs come from other apps (cert-manager, CloudNativePG) fail until
    # those CRDs exist, e.g. on a rebuilt cluster. Retry instead of waiting for a new commit.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
