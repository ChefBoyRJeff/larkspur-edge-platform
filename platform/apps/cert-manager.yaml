apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.3
    helm:
      valuesObject:
        crds:
          enabled: true
        # Prometheus reads certificate expiry and renewal times (alerts: platform/config/monitoring).
        # honorLabels keeps each certificate's own namespace label instead of cert-manager's.
        prometheus:
          servicemonitor:
            enabled: true
            honorLabels: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # The ServiceMonitor CRD comes from kube-prometheus-stack; on a rebuilt cluster it may not
      # exist yet. Retry instead of waiting for a new commit.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
