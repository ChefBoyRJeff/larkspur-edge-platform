# Pull request checks: app format, lint and tests against PostgreSQL 18; Helm chart lint and render.
# Third-party actions are pinned to full commit SHAs (version in the comment); see ADR-0003.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-checks:
    name: app-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: larkspur
          # Throwaway database that exists only for this CI run.
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: larkspur_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U larkspur -d larkspur_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://larkspur:ci-only-password@127.0.0.1:5432/larkspur_test
      TEST_DATABASE_URL: postgresql+psycopg://larkspur:ci-only-password@127.0.0.1:5432/larkspur_test
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install dependencies exactly as locked
        run: uv sync --locked
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q --durations=5

  chart-checks:
    name: chart-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same Helm version Argo CD v3.6.2 uses to render the chart in the cluster.
      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
          checksum-policy: required
      - name: Lint the chart
        run: helm lint --strict charts/larkspur-track -f charts/larkspur-track/values-dev.yaml
      - name: Render the dev manifests
        run: >-
          helm template larkspur-track charts/larkspur-track --namespace larkspur-dev
          -f charts/larkspur-track/values-dev.yaml
      - name: Rendering without an image tag must fail
        run: |
          if helm template larkspur-track charts/larkspur-track --set host=track.example.com; then
            echo "::error::the chart rendered without image.tag"
            exit 1
          fi
