# Pull request checks for Larkspur Track: format, lint and tests against PostgreSQL 18.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-checks:
    name: app-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: larkspur
          # Throwaway database that exists only for this CI run.
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: larkspur_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U larkspur -d larkspur_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://larkspur:ci-only-password@127.0.0.1:5432/larkspur_test
      TEST_DATABASE_URL: postgresql+psycopg://larkspur:ci-only-password@127.0.0.1:5432/larkspur_test
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
      - name: Install dependencies exactly as locked
        run: uv sync --locked
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q --durations=5
