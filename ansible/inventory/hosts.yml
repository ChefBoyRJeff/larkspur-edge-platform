all:
  children:
    k3s_cluster:
      children:
        # Control-plane servers with embedded etcd. The first one listed started the cluster
        # (cluster-init); the others join it. Keep an odd number (etcd quorum).
        k3s_server:
          hosts:
            lark-k3s-01:
              ansible_host: 192.168.1.199
            lark-k3s-02:
              ansible_host: 192.168.1.200
            lark-k3s-03:
              ansible_host: 192.168.1.201
        # Workers without a control plane (none at the moment).
        k3s_agents:
          hosts: {}
    # Site services outside the cluster.
    site_services:
      hosts:
        lark-dns-01:
          ansible_host: 192.168.1.202
