# Rolling OS patching: one node at a time, worker first, control plane last.
# k3s itself is not upgraded here (pinned in site.yml via k3s_version).
- name: Patch workers
  hosts: k3s_agents
  become: true
  serial: 1
  tasks:
    - name: Patch this node
      ansible.builtin.include_tasks: tasks/patch-node.yml

- name: Patch control plane
  hosts: k3s_server
  become: true
  serial: 1
  tasks:
    - name: Patch this node
      ansible.builtin.include_tasks: tasks/patch-node.yml
