# Converge every node to its desired state. Safe to run repeatedly.
- name: Base configuration for all cluster nodes
  hosts: k3s_cluster
  become: true
  roles:
    - common

- name: Control plane (k3s server)
  hosts: k3s_server
  become: true
  roles:
    - k3s_server

- name: Workers (k3s agents)
  hosts: k3s_agents
  become: true
  roles:
    - k3s_agent
