# Defaults shared by every environment; values-<env>.yaml sets the image tag and host.
image:
  repository: ghcr.io/chefboyrjeff/larkspur-track
  # Required: an immutable sha-<commit> tag published by the Image workflow.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

# Seconds a stopping web pod keeps serving, so Traefik removes it from its routes before
# uvicorn exits. Must stay below terminationGracePeriodSeconds (30).
shutdownDelaySeconds: 5

# Required: the HTTPS hostname, e.g. track.larkspur.home.arpa.
host: ""
# cert-manager ClusterIssuer for the TLS certificate (Larkspur internal CA).
tlsIssuer: larkspur-ca

database:
  # CloudNativePG creates <cluster>-app with a "uri" key; the app reads it as DATABASE_URL.
  clusterName: larkspur-db
  secretName: larkspur-db-app
  secretKey: uri

displayTimezone: America/New_York

metrics:
  # Prometheus metrics port; only Prometheus in the monitoring namespace may reach it
  # (networkpolicy.yaml). The Ingress routes only the http port, so it is never exposed.
  port: 9102
  serviceMonitor:
    # Needs the ServiceMonitor CRD from kube-prometheus-stack.
    enabled: true
    interval: 30s
  # Alert rules for this environment (templates/prometheusrule.yaml; docs/runbooks/alerts.md).
  alerts:
    enabled: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

sync:
  # The sync worker (larkspur-track-sync) sends outbox events to Azure Queue Storage (ADR-0009).
  # Needs the SealedSecret larkspur-track-sync-credentials with AZURE_QUEUE_URL and
  # AZURE_QUEUE_SAS (azure/integration/new-sync-credential.ps1), and an image with the worker.
  enabled: false
  credentialsSecret: larkspur-track-sync-credentials
  metricsPort: 9103
  intervalSeconds: 5
  maxBackoffSeconds: 300
  # Caps a runaway loop, and so the queue's cost.
  maxSendsPerMinute: 600
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

migration:
  # Seconds before a stuck migration is stopped; the sync then fails and nothing is rolled out.
  activeDeadlineSeconds: 300
  backoffLimit: 2
