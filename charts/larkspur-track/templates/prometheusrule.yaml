{{- if .Values.metrics.alerts.enabled }}
{{- $ns := .Release.Namespace }}
# Alert rules for this environment's Larkspur Track. Prometheus evaluates them; Alertmanager
# emails warning and critical alerts. What to do for each: docs/runbooks/alerts.md.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: larkspur-track
  labels:
    {{- include "larkspur-track.labels" . | nindent 4 }}
spec:
  groups:
    - name: larkspur-track
      rules:
        - alert: LarkspurTrackDown
          # No web pod has answered a Prometheus scrape (all down, or none running).
          expr: absent(up{job="larkspur-track", namespace="{{ $ns }}"} == 1)
          for: 2m
          labels:
            severity: critical
            namespace: {{ $ns }}
          annotations:
            summary: Larkspur Track in {{ $ns }} is down
            description: No web pod has answered Prometheus for 2 minutes.
            runbook: docs/runbooks/alerts.md#larkspurtrackdown
        - alert: LarkspurTrackUnavailable
          # Pods may run, but none is ready (readiness needs the database), so users get errors.
          expr: kube_deployment_status_replicas_available{namespace="{{ $ns }}", deployment="larkspur-track"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Larkspur Track in {{ $ns }} has no ready pods
            description: No web pod has been ready for 2 minutes; check the database first.
            runbook: docs/runbooks/alerts.md#larkspurtrackunavailable
        - alert: LarkspurTrackHighErrorRate
          # Server errors among real requests (health checks excluded).
          expr: |
            sum(rate(larkspur_http_requests_total{namespace="{{ $ns }}", route!~"/healthz|/readyz", status=~"5.."}[5m]))
              / sum(rate(larkspur_http_requests_total{namespace="{{ $ns }}", route!~"/healthz|/readyz"}[5m]))
              > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: More than 5% of requests to Larkspur Track in {{ $ns }} fail
            description: Over 5% of requests have returned a 5xx error for 10 minutes.
            runbook: docs/runbooks/alerts.md#larkspurtrackhigherrorrate
        - alert: LarkspurTrackSlow
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(larkspur_http_request_duration_seconds_bucket{namespace="{{ $ns }}", route!~"/healthz|/readyz"}[10m]))
            ) > 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Larkspur Track in {{ $ns }} is slow
            description: The slowest 5% of requests have taken over 1 second for 15 minutes.
            runbook: docs/runbooks/alerts.md#larkspurtrackslow
        - alert: LarkspurTrackManyFailedSignIns
          # Possible password guessing; accounts lock after 5 failures, so look at the audit log.
          expr: sum(increase(larkspur_sign_ins_total{namespace="{{ $ns }}", result="failure"}[15m])) > 20
          labels:
            severity: warning
          annotations:
            summary: Many failed sign-ins to Larkspur Track in {{ $ns }}
            description: More than 20 sign-ins have failed in 15 minutes; check the audit log.
            runbook: docs/runbooks/alerts.md#larkspurtrackmanyfailedsignins
        - alert: LarkspurReleaseStuck
          # A new release cannot start: an image that cannot be pulled, a container that keeps
          # crashing, or a failed migration. Running pods keep serving, so nothing else fires.
          expr: |
            max(kube_pod_container_status_waiting_reason{namespace="{{ $ns }}", container=~"migrate|web|sync", reason=~"ErrImagePull|ImagePullBackOff|InvalidImageName|CreateContainerConfigError|CrashLoopBackOff"}) > 0
              or max(kube_job_failed{namespace="{{ $ns }}", job_name="larkspur-track-migrate", condition="true"}) > 0
          for: 5m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            summary: A Larkspur Track release in {{ $ns }} cannot start
            description: A migration, web or sync container has been unable to start, or the migration has failed, for 5 minutes.
            runbook: docs/runbooks/alerts.md#larkspurreleasestuck
        {{- if .Values.sync.enabled }}
        - alert: LarkspurSyncWorkerDown
          expr: absent(up{namespace="{{ $ns }}", pod=~"larkspur-track-sync-.*"} == 1)
          for: 5m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            summary: The Larkspur Track sync worker in {{ $ns }} is down
            description: Prometheus has not reached the sync worker for 5 minutes; events wait in the outbox.
            runbook: docs/runbooks/alerts.md#larkspursyncworkerdown
        - alert: LarkspurSyncBacklog
          # Events wait in the outbox while the internet or Azure is unreachable; nothing is lost,
          # but Azure is behind.
          expr: max(larkspur_outbox_oldest_pending_seconds{namespace="{{ $ns }}"}) > 1800
          for: 5m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            summary: Shipment events from {{ $ns }} have not reached Azure for 30 minutes
            description: The oldest unsent outbox event is more than 30 minutes old.
            runbook: docs/runbooks/alerts.md#larkspursyncbacklog
        - alert: LarkspurSyncStalled
          # Rounds run at least every 5 minutes, even while sends fail.
          expr: time() - max(larkspur_sync_last_round_timestamp_seconds{namespace="{{ $ns }}"}) > 900
          for: 5m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            summary: The Larkspur Track sync worker in {{ $ns }} is stuck
            description: The sync worker has not completed a round for 15 minutes.
            runbook: docs/runbooks/alerts.md#larkspursyncstalled
        {{- end }}
{{- end }}
