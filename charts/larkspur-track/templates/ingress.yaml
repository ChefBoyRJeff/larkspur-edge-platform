# HTTPS only (Traefik websecure entrypoint).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: larkspur-track
  labels:
    {{- include "larkspur-track.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ required "host is required" .Values.host }}
      secretName: larkspur-track-tls
  rules:
    - host: {{ required "host is required" .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: larkspur-track
                port:
                  name: http
