apiVersion: v1
kind: Service
metadata:
  name: larkspur-track
  labels:
    {{- include "larkspur-track.labels" . | nindent 4 }}
  annotations:
    # Connect timeout for Traefik (traefik.yaml).
    traefik.ingress.kubernetes.io/service.serverstransport: {{ .Release.Namespace }}-larkspur-track@kubernetescrd
spec:
  selector:
    {{- include "larkspur-track.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
