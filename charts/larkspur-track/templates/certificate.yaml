# TLS certificate from the Larkspur internal CA; cert-manager renews it automatically.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: larkspur-track-tls
  labels:
    {{- include "larkspur-track.labels" . | nindent 4 }}
spec:
  secretName: larkspur-track-tls
  dnsNames:
    - {{ required "host is required" .Values.host }}
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: {{ .Values.tlsIssuer }}
    kind: ClusterIssuer
    group: cert-manager.io
