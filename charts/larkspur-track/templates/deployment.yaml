# Web pods. Wave 1: after the network policies (wave -1) and the migration job (wave 0).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: larkspur-track
  labels:
    {{- include "larkspur-track.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Start a new pod and wait for it to be ready before stopping an old one.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "larkspur-track.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "larkspur-track.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "larkspur-track.podSecurityContext" . | nindent 8 }}
      # Prefer one web pod per node. ScheduleAnyway, so a dead node never blocks scheduling.
      # matchLabelKeys counts only pods of the same release (ReplicaSet); without it, old pods
      # still shutting down during a rollout skew the count and both new pods can land together.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "larkspur-track.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: web
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: web
          image: {{ include "larkspur-track.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "larkspur-track.databaseEnv" . | nindent 12 }}
            - name: DISPLAY_TIMEZONE
              value: {{ .Values.displayTimezone | quote }}
            # Shown in the page footer, so anyone can see which release an environment runs.
            - name: APP_RELEASE
              value: {{ .Values.image.tag | quote }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          # Ready only when PostgreSQL answers (/readyz gives up after the 3 s connect timeout).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            # uvicorn needs a moment to start listening; probing at once only logs a failure.
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          # Alive as long as the process serves HTTP; a database outage never restarts pods.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # On shutdown, Kubernetes removes the pod from the Service and signals it at the same time;
          # Traefik sees the removal a moment later. Keep serving during that window.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.shutdownDelaySeconds }}
          resources:
            {{- include "larkspur-track.resources" .Values.resources | nindent 12 }}
          securityContext:
            {{- include "larkspur-track.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only; form uploads spool to /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
