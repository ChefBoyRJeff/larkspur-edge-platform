{% extends "base.html" %}
{% block title %}Sign in · Larkspur Track{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form class="stack" method="post" action="/sign-in">
  <input type="hidden" name="next" value="{{ next }}">
  <label for="username">Username</label>
  <input id="username" name="username" value="{{ username }}" required maxlength="40"
         autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" required maxlength="128"
         autocomplete="current-password">

  <button type="submit">Sign in</button>
</form>
{% endblock %}
