<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Larkspur Track{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1f2933; background: #f5f7fa; }
    header { background: #3d2c5e; padding: 0.75rem 1.5rem; }
    header a { color: #fff; text-decoration: none; font-weight: 600; }
    main { max-width: 60rem; margin: 1.5rem auto; padding: 0 1.5rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #e4e7eb; }
    .status { padding: 0.1rem 0.6rem; border-radius: 1rem; background: #e9e3f5; font-size: 0.85rem; }
    .error { color: #b42318; }
    form.stack label { display: block; margin-top: 0.75rem; font-weight: 600; }
    input, textarea { width: 100%; max-width: 28rem; padding: 0.4rem; }
    button, .button { display: inline-block; margin-top: 1rem; padding: 0.5rem 1rem; background: #3d2c5e;
      color: #fff; border: 0; border-radius: 0.25rem; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <header><a href="/shipments">Larkspur Track</a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
