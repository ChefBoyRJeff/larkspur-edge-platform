<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Larkspur Track{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1f2933; background: #f5f7fa; }
    header { background: #3d2c5e; padding: 0.75rem 1.5rem; display: flex; gap: 1.5rem; align-items: center; }
    header a { color: #fff; text-decoration: none; }
    header .brand { font-weight: 600; margin-right: auto; }
    main { max-width: 60rem; margin: 1.5rem auto; padding: 0 1.5rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #e4e7eb; }
    .status { padding: 0.1rem 0.6rem; border-radius: 1rem; background: #e9e3f5; font-size: 0.85rem; }
    .error { color: #b42318; }
    .done { color: #05603a; }
    .muted { color: #616e7c; }
    section { margin-top: 2rem; }
    form.stack label { display: block; margin-top: 0.75rem; font-weight: 600; }
    input, textarea, select { width: 100%; max-width: 28rem; padding: 0.4rem; }
    button, .button { display: inline-block; margin-top: 1rem; padding: 0.5rem 1rem; background: #3d2c5e;
      color: #fff; border: 0; border-radius: 0.25rem; text-decoration: none; cursor: pointer; }
    form.search { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end; margin: 1rem 0; }
    form.search label { display: block; font-weight: 600; }
    form.search input { width: 18rem; }
    form.search select { width: 9rem; }
    form.search button { margin-top: 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 1rem; }
    .card { background: #fff; border-radius: 0.5rem; padding: 1rem; text-decoration: none; color: inherit;
      border: 1px solid #e4e7eb; }
    .card .count { display: block; font-size: 2rem; font-weight: 700; color: #3d2c5e; }
    header .who { color: #e9e3f5; font-size: 0.9rem; }
    header form { margin: 0; }
    header form button { margin-top: 0; padding: 0.3rem 0.8rem; background: transparent; border: 1px solid #fff; }
    footer { max-width: 60rem; margin: 2rem auto; padding: 0 1.5rem; color: #616e7c; font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/shipments">Larkspur Track</a>
    {% if current_user %}
    <a href="/shipments">Shipments</a>
    <a href="/dashboard">Dashboard</a>
    {% if is_admin %}<a href="/admin/users">Users</a>{% endif %}
    <span class="who">{{ current_user.display_name }} ({{ current_user.role }})</span>
    <form method="post" action="/sign-out">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit">Sign out</button>
    </form>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Release {{ app_release }}</footer>
</body>
</html>
